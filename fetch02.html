<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos 2x5 Flex Gallery</title>
<style>
  /* body: 페이지 전체 배경과 폰트 설정 */
  body {
    margin: 0;
    padding: 40px 20px;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f5f7;
    color: #222;
  }

  /* h1: 페이지 제목 중앙 정렬 */
  h1 { text-align: center; margin-bottom: 30px; }

  /* #gallery: flex 컨테이너. 한 줄에 5개씩 배치되도록 wrap 허용, 가운데 정렬 */
  #gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* .item: 5열이 되도록 너비 계산 (전체 4개 gap=64px 제외 후 5등분) */
  .item {
    flex: 0 0 calc((100% - 64px) / 5);
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: transform .2s;
  }
  .item:hover { transform: translateY(-4px); }
  .item { cursor: pointer; }

  /* #modal: 화면 전체를 덮는 반투명 배경, flex로 팝업을 정중앙 배치 (기본은 숨김) */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  #modal.open { display: flex; }

  /* .modal-box: 확대된 카드를 담는 팝업 본체 */
  .modal-box {
    position: relative;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    max-width: 90vw;
    max-height: 90vh;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .modal-box img { display: block; width: min(600px, 80vw); aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; }
  .modal-box p { margin: 12px 0 0; font-size: 16px; font-weight: 600; }

  /* #modal-close: 팝업 우상단 X 닫기 버튼 */
  #modal-close {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: #e5484d;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }

  /* img: 카드 너비에 맞춰 정사각형으로 표시 */
  .item img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }

  /* .item p: 사진 제목 (길면 말줄임) */
  .item p {
    margin: 0;
    padding: 8px 10px;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <h1>Photo Gallery (2행 × 5열)</h1>
  <!-- 이미지 카드가 동적으로 삽입될 영역 -->
  <div id="gallery"></div>

  <!-- 카드 클릭 시 표시되는 팝업 (배경 클릭 / X 버튼 / ESC로 닫힘) -->
  <div id="modal">
    <div class="modal-box">
      <button id="modal-close" aria-label="닫기">&times;</button>
      <img id="modal-img" src="" alt="">
      <p id="modal-title"></p>
    </div>
  </div>

<script>
  /*
   * fetchData: 재사용 가능한 비동기 데이터 요청 함수
   *  - url: 요청할 API 주소
   *  - fetch()로 요청 → await로 응답 대기
   *  - response.ok 확인 후 실패 시 에러 throw
   *  - response.json()으로 JSON 파싱 후 반환
   */
  async function fetchData(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP 오류: ${response.status}`);
    return await response.json();
  }

  /*
   * renderImages: 재사용 가능한 이미지 렌더링 함수
   *  - photos: 사진 데이터 배열
   *  - container: 카드가 들어갈 DOM 요소
   *  - 각 데이터의 url을 img 태그의 src에 설정하고 title을 캡션으로 표시
   */
  function renderImages(photos, container) {
    container.innerHTML = photos.map(p => `
      <div class="item">
        <img src="${p.url}" alt="${p.title}">
        <p>${p.title}</p>
      </div>`).join('');
  }

  /*
   * loadGallery: 전체 흐름 제어 함수
   *  - apiUrl: 사진 API 주소, count: 가져올 개수 (기본 10 = 2행 x 5열)
   *  - fetchData로 전체 데이터를 받고 slice(0, count)로 앞에서 count개만 사용
   *  - try/catch로 네트워크/HTTP 오류 처리
   */
  async function loadGallery(apiUrl, count = 10) {
    const gallery = document.getElementById('gallery');
    try {
      const photos = await fetchData(apiUrl);
      renderImages(photos.slice(0, count), gallery);
    } catch (error) {
      gallery.textContent = '데이터를 불러오지 못했습니다: ' + error.message;
    }
  }

  /*
   * 팝업 제어
   *  - openModal: 클릭한 카드의 img/제목을 팝업에 복사하고 open 클래스로 표시
   *  - closeModal: open 클래스를 제거해 숨김
   *  - 갤러리에 이벤트 위임: 동적으로 생성된 .item 클릭을 한 번에 처리
   *  - 닫기: X 버튼, 어두운 배경 클릭, ESC 키
   */
  const modal = document.getElementById('modal');
  const openModal = (item) => {
    const img = item.querySelector('img');
    document.getElementById('modal-img').src = img.src;
    document.getElementById('modal-img').alt = img.alt;
    document.getElementById('modal-title').textContent = img.alt;
    modal.classList.add('open');
  };
  const closeModal = () => modal.classList.remove('open');

  document.getElementById('gallery').addEventListener('click', (e) => {
    const item = e.target.closest('.item');
    if (item) openModal(item);
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // 실행: photos API에서 10개를 가져와 2행 5열로 표시
  loadGallery('https://jsonplaceholder.typicode.com/photos', 10);
</script>
</body>
</html>
