<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        Ctrl + /: 줄 주석
        Ctrl + D: 줄 삭제
        Ctrl + Z: 되돌리기
        Ctrl + Shift + Z: 다시 되돌리기
        Alt + sHIFT + 화살표 ↑ or ↓: 한 줄 복사
        Alt + 화살표 ↑ or ↓: 한 줄 이동
        Ctrl + A: 전체 선택
        Ctrl + Space bar: 자동 완성
     -->

    <!-- <marquee direction="down" height="100" scrollamount="3">😀😁😂🤣😎</marquee> -->
    
    <!-- p: 문단을 나누는 태그 -->
    <P>클로드로 하고 싶은 것들</P>

    <!-- h1: 가장 큰 제목을 나타내는 태그 -->
    <h1>바이브 코딩</h1>
    <!-- strong: 글자를 굵게 강조하는 태그 -->
    <strong>웹 사이트 만들기</strong>
    <!-- i: 글자를 기울여 표시하는 태그 -->
    <i>멋진 포트폴리오 만들기</i>
    <!-- mark: 글자에 형광펜처럼 배경색을 입혀 강조하는 태그 -->
    <mark>클로드 자동화</mark>

    <!-- 중첩 태그 -->
    <h1>
        <mark>
            태그를 꾸미기
        </mark>
    </h1>

</body>
</html>
