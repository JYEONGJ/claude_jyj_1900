<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- ul: 순서가 없는 목록을 만드는 태그 -->
    <ul>
        <!-- li: 목록의 각 항목을 나타내는 태그 -->
        <li>사과</li>
        <li>바나나</li>
        <li>포도</li>
    </ul>
    <!-- ol: 순서가 있는 목록을 만드는 태그 -->
    <ol>
        <li>재료 손질하기</li>
        <li>물 끓이기</li>
        <li>면과 스프 넣기</li>
    </ol>
</body>
</html>
