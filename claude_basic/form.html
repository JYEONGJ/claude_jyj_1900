<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>text: <input type="text" placeholder="아이디(이메일)" /></label><br>
    <label>password: <input type="password" placeholder="비밀번호" /></label><br>
    <label>email: <input type="email" placeholder="example@email.com" /></label><br>
    <label>number: <input type="number" placeholder="숫자 입력" /></label><br>
    <label>tel: <input type="tel" placeholder="010-1234-5678" /></label><br>
    <label>search: <input type="search" placeholder="검색어 입력" /></label><br>
    <label>url: <input type="url" placeholder="https://example.com" /></label><br>
    <label>date: <input type="date" /></label><br>
    <label>time: <input type="time" /></label><br>
    <label>datetime-local: <input type="datetime-local" /></label><br>
    <label>month: <input type="month" /></label><br>
    <label>week: <input type="week" /></label><br>
    <label>color: <input type="color" /></label><br>
    <label>range: <input type="range" min="0" max="100" /></label><br>
    <label>checkbox: <input type="checkbox" /></label><br>
    <label>radio: <input type="radio" name="radioGroup" /></label><br>
    <label>file: <input type="file" /></label><br>
    <label>hidden: <input type="hidden" value="hiddenValue" /></label><br>
    <label>button: <input type="button" value="버튼" /></label><br>
    <label>submit: <input type="submit" value="제출" /></label><br>
    <label>reset: <input type="reset" value="초기화" /></label><br>
    <label>image: <input type="image" src="" alt="이미지 버튼" /></label>
</body>
</html>
